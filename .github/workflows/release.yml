name: Prepare plugin release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
concurrency:
  group: pm2-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Prepare clean candidate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs stage "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: pm2-release-candidate
          path: .release/candidate-*/
          if-no-files-found: error
  draft:
    needs: candidate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pm2-release-candidate
          path: candidate
      - name: Create draft with unsigned signing candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists. Refusing to replace its assets.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" candidate/*-candidate.zip candidate/*.sha256 --verify-tag --draft --title "PM2 Monitor $RELEASE_TAG" --notes 'Unsigned candidate only. Download, sign offline, upload the signed ZIP to this draft, then run Promote signed plugin release. Do not install this candidate as a trusted marketplace release.'
